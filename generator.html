<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6b4f">
<title>مولد أكواد التفعيل — حلال أبو خالد 2026</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f7f5;color:#16352a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
.wrap{max-width:650px;margin:35px auto;padding:18px}
.card{background:white;border-radius:24px;padding:28px;box-shadow:0 10px 35px #00000012}
h1{text-align:center;color:#0b6b4f;margin:0 0 8px;font-size:30px}
.sub{text-align:center;color:#66756e;margin:0 0 25px}
label{display:block;font-weight:700;margin:12px 0 7px}
input{width:100%;padding:15px;border:1px solid #cfded7;border-radius:14px;font-size:18px;direction:ltr;text-align:center;background:#fff}
button{width:100%;border:0;border-radius:14px;padding:15px;font-size:18px;font-weight:700;cursor:pointer;margin-top:14px}
.primary{background:#0b6b4f;color:white}
.secondary{background:#edf6f1;color:#0b6b4f}
.result{margin-top:20px;background:#effaf4;border:1px solid #c8e8d6;border-radius:16px;padding:18px;text-align:center;display:none}
.result small{display:block;color:#60756a;margin-bottom:8px}
.code{font-size:25px;font-weight:800;letter-spacing:1px;direction:ltr}
.note{margin-top:18px;color:#6b7972;font-size:13px;line-height:1.7;text-align:center}
.error{color:#b42318;margin-top:10px;text-align:center;min-height:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div style="text-align:center;font-size:52px">🐑🔐</div>
    <h1>مولد أكواد التفعيل</h1>
    <p class="sub">حلال أبو خالد 2026</p>

    <label for="device">رقم الجهاز</label>
    <input id="device" value="" placeholder="رقم الجهاز" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

    <button class="primary" onclick="generate()">إنشاء كود التفعيل</button>

    <div id="error" class="error"></div>

    <div id="result" class="result">
      <small>كود التفعيل</small>
      <div id="code" class="code"></div>
      <button class="secondary" onclick="copyCode()"></button>
    </div>

    <p class="note">
      هذا المولد يستخدم نفس طريقة التفعيل الموجودة في نسخة حلال أبو خالد 2026:
      SHA-256 لرقم الجهاز مع مفتاح التفعيل الدائم.
      لا توجد مدة 3 أشهر.
    </p>
  </div>
</div>

<script>
const AK_ACTIVATION_SALT='HALAL-ABU-KHALID-PERMANENT-2026-v1';

function normalizeDeviceId(value){
  return String(value||'').trim().toUpperCase();
}

async function makeActivationCode(deviceId){
  const raw=normalizeDeviceId(deviceId)+'|'+AK_ACTIVATION_SALT;
  const digest=await crypto.subtle.digest(
    'SHA-256',
    new TextEncoder().encode(raw)
  );
  const h=Array.from(new Uint8Array(digest),b=>
    b.toString(16).padStart(2,'0')
  ).join('').toUpperCase();

  return 'AK-'+h.slice(0,4)+'-'+h.slice(4,8)+'-'+h.slice(8,12);
}

async function generate(){
  const input=document.getElementById('device');
  const error=document.getElementById('error');
  const result=document.getElementById('result');
  const code=document.getElementById('code');

  const id=normalizeDeviceId(input.value);
  error.textContent='';
  result.style.display='none';

  if(!/^AK-[A-F0-9]{8}-[A-F0-9]{8}$/.test(id)){
    error.textContent='تأكد من رقم الجهاز، مثال: AK-5055EF3E-934689F4';
    return;
  }

  try{
    const generated=await makeActivationCode(id);
    code.textContent=generated;
    result.style.display='block';
  }catch(e){
    error.textContent='تعذر إنشاء الكود في هذا المتصفح.';
  }
}

async function copyCode(){
  const code=document.getElementById('code').textContent;
  if(navigator.clipboard){
    await navigator.clipboard.writeText(code);
    
  }
}

document.getElementById('device').addEventListener('keydown',e=>{
  if(e.key==='Enter') generate();
});
</script>
</body>
</html>
